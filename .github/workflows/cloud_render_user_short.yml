name: Render Viral Hook Short on Cloud

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/viral-hook-short/**'
      - '.github/workflows/cloud_render_user_short.yml'

jobs:
  render_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install faster-whisper

      - name: Run Cloud Render Pipeline
        run: |
          python projects/viral-hook-short/render_short.py

      - name: Upload Final Render Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_viral_short.mp4
          path: projects/viral-hook-short/final_viral_short.mp4
