name: Render Professional 51 Effects Video on Cloud

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/viral-effects/**'
      - '.github/workflows/cloud_render_effects.yml'

jobs:
  render_effects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf libegl1 libgles2 libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install opencv-python pillow mediapipe numpy

      - name: Run Master 51 Video Effects & Typography Pipeline
        run: |
          python projects/viral-effects/run_pipeline.py

      - name: Upload Final Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_master_reel.mp4
          path: projects/viral-effects/final_master_reel.mp4
